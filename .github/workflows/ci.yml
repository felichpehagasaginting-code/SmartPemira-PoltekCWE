name: Smart Pemira CI/CD Guardrails

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "file:./db/ci.db"
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma Client Generate & Schema Push
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Seed Initial State
        run: npx tsx scripts/seed.ts

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: npx vitest run --run

      - name: Verify Next.js Production Build
        run: npm run build

      - name: Start Production Server for E2E
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server ready (health check OK)"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health

      - name: Run E2E Architecture & RBAC Tests
        run: npx tsx scripts/e2e-test.ts

      - name: Re-seed Database for Feature Tests
        run: npx tsx scripts/seed.ts

      - name: Run E2E Feature Tests (Rate Limit, Operator, Receipt, BA)
        run: npx tsx scripts/e2e-features-test.ts

      - name: Final Health Check
        run: curl -sf http://localhost:3000/api/health | tee /dev/stderr | grep -q '"ok":true'
