name: Smart Pemira CI

# Rekomendasi #10 — pipeline otomatis: lint + typecheck + E2E penuh
# dijalankan pada setiap push & pull request.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "file:./db/custom.db"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate + push schema
        run: |
          bunx prisma generate
          bunx prisma db push --accept-data-loss

      - name: Seed database (kondisi demo)
        run: bunx tsx scripts/seed.ts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Start dev server
        run: |
          bun run dev &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server siap (health check OK)"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health

      - name: E2E — hukum arsitektur & RBAC
        run: bunx tsx scripts/e2e-test.ts

      - name: Re-seed sebelum E2E fitur
        run: bunx tsx scripts/seed.ts

      - name: E2E — fitur upgrade (rate limit, operator, receipt, BA)
        run: bunx tsx scripts/e2e-features-test.ts

      - name: Health check akhir
        run: curl -sf http://localhost:3000/api/health | tee /dev/stderr | grep -q '"ok":true'
